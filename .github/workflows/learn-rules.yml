name: Learn rules

# Once a day, read the PRs merged since the last run and open a PR that turns repeated mistakes
# into checks and CLAUDE.md rules. The procedure is .claude/commands/learn-rules.md.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip without an API key or new merges
        id: scope
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::ANTHROPIC_API_KEY secret not set; rules not learned."; exit 0; fi
          last=$(sed -n 's/^Last PR learned from: #\{0,1\}\([0-9]*\).*/\1/p' company/rules-log.md)
          newest=$(gh pr list --state merged --limit 1 --json number --jq '.[0].number')
          if [ -n "$last" ] && [ "$newest" -le "$last" ]; then echo "No PRs merged since #$last."; exit 0; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: steps.scope.outputs.run == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: --max-turns 80
          prompt: |
            Follow .claude/commands/learn-rules.md exactly, starting after the last PR named in
            company/rules-log.md. The repository is SatyamDave/real-world. Open the PR on a branch
            named rules/<date>. If no failure class meets the bar in step 3, change nothing.
