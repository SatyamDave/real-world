[tool.uv.workspace]
members = ["engine", "api"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["engine", "api"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.isort]
known-first-party = ["rw", "rw_api"]
