[project]
name = "rw-api"
version = "0.1.0"
description = "Real World HTTP API over the rw engine"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["rw", "fastapi", "uvicorn"]

[dependency-groups]
dev = ["httpx"]

[tool.uv.sources]
rw = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "rw_api"
